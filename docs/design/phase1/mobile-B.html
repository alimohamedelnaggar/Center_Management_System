<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>المرحلة 1 — لوحات الموبايل B</title>
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="compare.css" />
<style>
  body.v-after { overflow-x: clip; }
  .board { max-width: 1320px; margin: 0 auto; padding: 26px 16px 60px; display: grid; gap: 22px; }
  .board-head { display: grid; gap: 8px; }
  .kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .14em; color: var(--text2); font-family: "Manrope", sans-serif; }
  .kicker i { width: 22px; height: 2px; background: var(--primary); border-radius: 2px; }
  .board-head h1 { font-size: clamp(24px, 3vw, 34px); letter-spacing: -.03em; }
  .board-head p { max-width: 760px; color: var(--text2); font-size: 13.5px; }
  .frames { display: grid; grid-template-columns: repeat(3, 390px); gap: 24px; justify-content: center; align-items: start; }
  .frame-wrap { margin: 0; display: grid; gap: 10px; }
  .phone-title { display: grid; gap: 2px; padding: 0 4px; }
  .phone-title b { font-size: 14px; }
  .phone-title span { font-size: 11.5px; color: var(--text2); }

  .phone {
    width: 390px; height: 844px; padding: 9px; border-radius: 38px;
    background: #0b102a; box-shadow: 0 30px 70px -34px rgba(11, 16, 42, .7), 0 0 0 1px rgba(11, 16, 42, .9);
  }
  .phone-screen {
    position: relative; height: 100%; border-radius: 30px; overflow: hidden;
    background: var(--bg); color: var(--text); display: flex; flex-direction: column;
  }
  .pstat {
    flex: 0 0 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; font-size: 11px; font-weight: 700; color: var(--text);
    background: var(--card); border-bottom: 1px solid transparent;
  }
  .pstat .notch { width: 88px; height: 18px; border-radius: 999px; background: #0b102a; }
  .pstat .sig { display: inline-flex; align-items: center; gap: 4px; }
  .pstat .sig svg { width: 13px; height: 13px; }

  .papp {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border);
    min-height: 56px;
  }
  .papp h2 { font-size: 16px; letter-spacing: -.01em; }
  .papp .sub { font-size: 10.5px; color: var(--text2); }
  .papp .grow { flex: 1; min-width: 0; }
  .papp .icon-btn { min-width: 44px; min-height: 44px; border-color: transparent; background: transparent; }
  .pbody { flex: 1; min-height: 0; overflow: auto; padding: 12px; display: grid; gap: 12px; align-content: start; }
  .pbody.flush { padding: 0; gap: 0; }
  .sec-cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sec-cap b { font-size: 14px; }
  .sec-cap span { font-size: 11px; color: var(--text2); }
  .chip-row { display: flex; gap: 6px; overflow: auto; padding-bottom: 2px; }
  .chip-row .pill { min-height: 44px; padding: 0 14px; font-size: 12.5px; border: 1px solid var(--border); background: var(--card); }
  .chip-row .pill[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }

  .phone .mcards { display: block; background: var(--card); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; }
  .phone .mcard { padding: 13px 14px; gap: 9px; }
  .phone .mcard .name b { font-size: 15px; }
  .phone .mcard-meta { font-size: 12px; }
  .phone .mcard-foot { padding-top: 2px; }

  /* drawer */
  .drawer-layer { position: absolute; inset: 28px 0 0; z-index: 40; transition: opacity .16s ease; }
  .drawer-layer[hidden] { display: none; }
  @media (prefers-reduced-motion: reduce) { .drawer-layer { transition: none; } }
  .drawer-layer .drawer-scrim { position: absolute; inset: 0; background: rgba(8, 11, 24, .55); }
  .drawer-layer .drawer { position: absolute; inset-block: 0; inset-inline-start: 0; width: 300px; }
  .drawer .side-head { padding: 16px 14px 10px; }
  .drawer .side-nav { padding: 4px 8px 10px; overflow: auto; }
  .drawer .side-foot { padding: 10px; }
  .drawer .nav-item { min-height: 46px; font-size: 13px; }
  .drawer-user { display: flex; align-items: center; gap: 9px; padding: 8px; border-radius: 12px; background: var(--bg); margin-bottom: 8px; }
  .drawer-user b { display: block; font-size: 12.5px; }
  .drawer-user small { display: block; font-size: 10.5px; color: var(--text2); }

  /* bottom sheet */
  .sheet-layer { position: absolute; inset: 28px 0 0; z-index: 50; display: flex; align-items: flex-end; }
  .sheet-layer .drawer-scrim { position: absolute; inset: 0; background: rgba(8, 11, 24, .55); }
  .sheet-layer .sheet { position: relative; z-index: 1; max-height: 95%; }
  .sheet-b .label { margin-bottom: 5px; }
  .sheet-b .input, .sheet-b .select { min-height: 44px; }
  .req { color: var(--err); }

  /* exam */
  .timer-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
    border-radius: 999px; background: var(--muted); color: var(--text);
    font-family: "Manrope", sans-serif; font-size: 15px; font-weight: 800;
    font-variant-numeric: tabular-nums; direction: ltr;
  }
  .timer-chip svg { width: 15px; height: 15px; color: var(--text2); }
  .exam-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--text2); }
  .exam-bar b { color: var(--text); }
  .progress { height: 6px; border-radius: 999px; background: var(--muted); overflow: hidden; }
  .progress i { display: block; height: 100%; border-radius: inherit; background: var(--primary); }
  .qcard { padding: 14px; display: grid; gap: 10px; }
  .qcard p { font-size: 14.5px; font-weight: 600; line-height: 1.75; }
  .opt {
    display: flex; align-items: flex-start; gap: 10px; min-height: 52px; padding: 10px 12px;
    border: 1.5px solid var(--border); border-radius: 12px; background: var(--card);
    font-size: 13.5px; cursor: pointer;
  }
  .opt input { appearance: none; width: 22px; height: 22px; flex: 0 0 22px; border: 2px solid var(--border); border-radius: 50%; margin: 2px 0 0; }
  .opt input:checked { border-color: var(--primary); background: radial-gradient(circle, var(--primary) 0 5px, transparent 5.5px); }
  .opt:has(input:checked) { border-color: var(--primary); background: var(--primary-soft); }
  .exam-foot {
    flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--border); background: var(--card); display: grid; gap: 8px;
  }
  .exam-foot .btn { width: 100%; }
  .exam-foot small { text-align: center; font-size: 10.5px; color: var(--text2); }

  /* import */
  .imp-summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .imp-stat { padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); text-align: center; }
  .imp-stat b { display: block; font-family: "Manrope", sans-serif; font-size: 19px; }
  .imp-stat small { font-size: 10.5px; color: var(--text2); }
  .imp-card { padding: 11px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); display: grid; gap: 4px; }
  .imp-card .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .imp-card .top b { font-size: 14px; }
  .imp-card small { font-size: 11.5px; color: var(--text2); }
  .imp-card .err-line { color: var(--err); font-size: 11.5px; display: flex; align-items: center; gap: 5px; }
  .imp-card .err-line svg { width: 13px; height: 13px; }
  .imp-foot { flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); background: var(--card); display: grid; gap: 8px; }

  @media (max-width: 1260px) {
    .frames { grid-template-columns: repeat(2, 390px); }
  }
  @media (max-width: 840px) {
    .frames { grid-template-columns: 390px; }
  }
  @media (max-width: 430px) {
    .board { padding: 0; gap: 0; }
    .board-head { display: none; }
    .frames { display: block; }
    .frame-wrap { gap: 0; }
    .phone-title { padding: 10px 14px 6px; background: var(--bg); }
    .phone { width: 100%; height: 844px; padding: 0; border-radius: 0; box-shadow: none; }
    .phone-screen { border-radius: 0; }
    .pstat .notch { width: 76px; }
  }
</style>
</head>

<script>
  (function () {
    // Tiny ticking clock so the "always visible" timer is real, not a label.
    var el = document.getElementById("exam-timer");
    if (!el) return;
    var total = 24 * 60 + 51;
    setInterval(function () {
      total = Math.max(0, total - 1);
      var m = String(Math.floor(total / 60)).padStart(2, "0");
      var s = String(total % 60).padStart(2, "0");
      el.textContent = "00:" + m + ":" + s;
    }, 1000);
  })();
  (function () {
    var layer = document.getElementById("mobile-drawer");
    var opener = document.querySelector("[data-drawer-open]");
    if (!layer || !opener) return;
    function setDrawer(open) {
      layer.hidden = !open;
      opener.setAttribute("aria-expanded", String(open));
      if (open) {
        var close = layer.querySelector("[data-drawer-close]");
        if (close) close.focus();
      } else {
        opener.focus();
      }
    }
    opener.addEventListener("click", function () { setDrawer(true); });
    layer.querySelectorAll("[data-drawer-close]").forEach(function (btn) {
      btn.addEventListener("click", function () { setDrawer(false); });
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !layer.hidden) setDrawer(false);
    });
  })();
</script>
